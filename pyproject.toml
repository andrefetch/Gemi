[project]
name = "gemi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argparse>=1.4.0",
    "google-genai==1.12.1",
    "python-dotenv==1.1.0",
    "rich>=15.0.0",
    "textual>=8.2.7",
]

[project.scripts]
gemi = "gemi.main:main"
gemi-tui = "gemi.tui:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gemi"]
